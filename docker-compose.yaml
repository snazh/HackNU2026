version: "3.9"

services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_TLDRAW_LICENSE_KEY: ${NEXT_PUBLIC_TLDRAW_LICENSE_KEY}
        NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY: ${NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY:-}
        NEXT_PUBLIC_LIVEBLOCKS_USE_AUTH: ${NEXT_PUBLIC_LIVEBLOCKS_USE_AUTH:-false}
        NEXT_PUBLIC_LIVEBLOCKS_ROOM_ID: ${NEXT_PUBLIC_LIVEBLOCKS_ROOM_ID:-hackathon-ai-brainstorm-room}
    container_name: hacknu_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      LIVEBLOCKS_SECRET_KEY: ${LIVEBLOCKS_SECRET_KEY:-}
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    container_name: hacknu_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env