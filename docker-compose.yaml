version: "3.9"

services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        # Browser calls the API on the host-mapped port (same machine as the user).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY: ${NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY:-}
        NEXT_PUBLIC_LIVEBLOCKS_USE_AUTH: ${NEXT_PUBLIC_LIVEBLOCKS_USE_AUTH:-false}
        NEXT_PUBLIC_LIVEBLOCKS_ROOM_ID: ${NEXT_PUBLIC_LIVEBLOCKS_ROOM_ID:-hackathon-ai-brainstorm-room}
    container_name: hacknu_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Server-side route `/api/liveblocks-auth` (not baked into the client bundle)
      LIVEBLOCKS_SECRET_KEY: ${LIVEBLOCKS_SECRET_KEY:-}
    depends_on:
      backend:
        condition: service_started

  # Наш бэкенд (агент на Groq)
  backend:
    build:
      context: ./backend  # Путь к папке, где лежит Dockerfile
    container_name: hacknu_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB__DB_HOST=postgres-db
      - REDIS__REDIS_HOST=redis
      - MEILISEARCH__HOST=http://meilisearch:7700
    depends_on:
      redis:
        condition: service_started
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS__REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped


volumes:
  redis_data:
